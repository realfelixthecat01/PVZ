# Запуск PVZS + HTTPS-прокси на VPS:
#   1. DNS: A-запись pvz.k11.by → IP этого сервера (в панели k11.by).
#   2. docker compose up -d --build
# Данные сервера (pvz.db, задачники, файлы) — в named-volume pvz-data.
services:
  pvzs:
    build: .
    environment:
      # Caddy (прокси) работает из соседнего контейнера — доверяем его IP,
      # чтобы сервер видел реальный адрес клиента и понимал X-Forwarded-Proto: https.
      PVZ_TRUSTED_PROXIES: 172.30.0.10
    volumes:
      - pvz-data:/data
    networks:
      pvz:
        ipv4_address: 172.30.0.2
    restart: unless-stopped

  proxy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      pvz:
        ipv4_address: 172.30.0.10
    restart: unless-stopped

networks:
  pvz:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  pvz-data:
  caddy-data:
  caddy-config:
